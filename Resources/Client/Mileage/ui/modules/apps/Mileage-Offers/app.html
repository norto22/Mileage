<div ng-controller="MileageOffers" class="mileageOffers">
	<link rel="stylesheet" type="text/css" href="/ui/modules/apps/Mileage-Offers/app.css">

	<div class="mo-card" ng-if="race">
		<div class="mo-title" ng-if="race.view.title" ng-bind="race.view.title"></div>
		<div class="mo-big" ng-if="race.view.big" ng-bind="race.view.big"></div>
		<div class="mo-row" ng-repeat="row in race.view.rows">
			<span class="mo-label" ng-bind="row.label"></span>
			<span class="mo-value" ng-bind="row.value"></span>
		</div>
		<div class="mo-note" ng-if="race.view.note" ng-bind="race.view.note"></div>
		<div class="mo-actions">
			<button class="mo-danger" ng-if="race.view.giveUp" ng-click="giveUp()" ng-bind="race.view.giveUp"></button>
			<button ng-if="race.view.close" ng-click="closeRace()">Close</button>
		</div>
	</div>

	<div class="mo-card mo-drag" ng-if="drag">
		<div class="mo-title" ng-if="drag.view.title" ng-bind="drag.view.title"></div>
		<div class="mo-row" ng-repeat="row in drag.view.rows">
			<span class="mo-label" ng-bind="row.label"></span>
			<span class="mo-value" ng-bind="row.value"></span>
		</div>
		<div class="mo-note" ng-if="drag.view.note" ng-bind="drag.view.note"></div>
		<div class="mo-actions">
			<button class="mo-danger" ng-if="drag.view.callOff" ng-click="callOffDrag()" ng-bind="drag.view.callOff"></button>
			<button ng-if="drag.view.close" ng-click="closeDrag()">Close</button>
		</div>
	</div>

	<div class="mo-card mo-drag" ng-if="dragRun">
		<div class="mo-title" ng-bind="dragRun.view.title"></div>
		<div class="mo-row" ng-repeat="row in dragRun.view.rows">
			<span class="mo-label" ng-bind="row.label"></span>
			<span class="mo-value" ng-bind="row.value"></span>
		</div>
		<div class="mo-note" ng-if="dragRun.view.note" ng-bind="dragRun.view.note"></div>
		<div class="mo-actions">
			<button ng-click="closeDragRun()">Close</button>
		</div>
	</div>

	<div class="mo-card" ng-if="traffic">
		<div class="mo-head">
			<span class="mo-title" ng-bind="traffic.view.title"></span>
			<span class="mo-key" ng-if="traffic.view.key" ng-bind="traffic.view.key"></span>
			<span class="mo-label" ng-if="traffic.view.keyHint" ng-bind="traffic.view.keyHint"></span>
		</div>
		<div class="mo-line" ng-if="traffic.view.line" ng-bind="traffic.view.line"></div>
		<div class="mo-row" ng-repeat="row in traffic.view.rows">
			<span class="mo-label" ng-bind="row.label"></span>
			<span class="mo-value" ng-bind="row.value"></span>
		</div>
		<table class="mo-table" ng-if="traffic.view.places">
			<tr><th>#</th><th>Racer</th><th>Time</th></tr>
			<tr ng-repeat="row in traffic.view.places">
				<td ng-bind="row.place"></td><td ng-bind="row.name"></td><td ng-bind="row.value"></td>
			</tr>
		</table>
		<div class="mo-bar" ng-if="traffic.view.join"><div class="mo-bar-fill" ng-style="{width: barWidth(traffic)}"></div></div>
		<div class="mo-note" ng-if="traffic.view.note" ng-bind="traffic.view.note"></div>
		<div class="mo-actions">
			<button class="mo-accept" ng-if="traffic.view.race" ng-disabled="traffic.view.raceOff" ng-click="raceTraffic()">Race this car</button>
			<button class="mo-accept" ng-if="traffic.view.join" ng-click="joinTraffic()">Join</button>
			<button class="mo-decline" ng-if="traffic.view.join" ng-click="declineTraffic()">Decline</button>
			<button ng-if="traffic.view.close" ng-click="closeTraffic()">Close</button>
		</div>
	</div>

	<div class="mo-card" ng-if="spot">
		<div class="mo-title" ng-if="spot.view.title" ng-bind="spot.view.title"></div>
		<div class="mo-big" ng-if="spot.view.big" ng-bind="spot.view.big"></div>
		<div class="mo-tabs" ng-if="spot.view.layouts">
			<button ng-repeat="layout in spot.view.layouts" ng-class="{'mo-tab-on': layout.on}" ng-click="spotLayout(layout.index)" ng-bind="layout.name"></button>
		</div>
		<div class="mo-row" ng-repeat="row in spot.view.rows">
			<span class="mo-label" ng-bind="row.label"></span>
			<span class="mo-value" ng-bind="row.value"></span>
		</div>
		<div class="mo-warn" ng-if="spot.view.warn" ng-bind="spot.view.warn"></div>
		<div ng-if="spot.view.stepper">
			<div class="mo-sub">Opponents (cars like yours)</div>
			<div class="mo-stepper">
				<button ng-click="spotOpponents(-1)" ng-disabled="spot.view.stepper.value <= 0">−</button>
				<output ng-bind="spot.view.stepper.value"></output>
				<button ng-click="spotOpponents(1)" ng-disabled="spot.view.stepper.value >= spot.view.stepper.max">+</button>
				<span class="mo-label">of <span ng-bind="spot.view.stepper.max"></span></span>
			</div>
		</div>
		<div ng-if="spot.view.players && spot.view.players.length > 0">
			<div class="mo-sub">Invite players</div>
			<label class="mo-pick" ng-repeat="player in spot.view.players">
				<input type="checkbox" ng-checked="player.on" ng-disabled="player.busy" ng-click="spotPick(player)">
				<span ng-bind="player.name"></span><span class="mo-label" ng-if="player.busy"> · in a race</span>
			</label>
		</div>
		<table class="mo-table" ng-if="spot.view.places">
			<tr><th>#</th><th>Racer</th><th>Time</th></tr>
			<tr ng-repeat="row in spot.view.places" ng-class="{'mo-me': row.me}">
				<td ng-bind="row.place"></td><td ng-bind="row.name"></td><td ng-bind="row.value"></td>
			</tr>
		</table>
		<div class="mo-bar" ng-if="spot.view.join"><div class="mo-bar-fill" ng-style="{width: barWidth(spot)}"></div></div>
		<div class="mo-note" ng-if="spot.view.note" ng-bind="spot.view.note"></div>
		<div class="mo-note" ng-repeat="line in spot.view.notes track by $index" ng-bind="line"></div>
		<div class="mo-actions">
			<button class="mo-accept" ng-if="spot.view.start" ng-disabled="spot.view.startOff" ng-click="spotStart()" ng-bind="spot.view.start"></button>
			<button ng-if="spot.view.cancel" ng-click="spotCancel()">Cancel</button>
			<button class="mo-accept" ng-if="spot.view.join" ng-click="spotJoin()">Join</button>
			<button class="mo-decline" ng-if="spot.view.join" ng-click="spotDecline()">Decline</button>
			<button class="mo-accept" ng-if="spot.view.startNow" ng-click="spotStartNow()">Start now</button>
			<button class="mo-decline" ng-if="spot.view.callOff" ng-click="spotCallOff()">Call off</button>
			<button class="mo-danger" ng-if="spot.view.giveUp" ng-click="spotGiveUp()">Give up</button>
			<button ng-if="spot.view.close" ng-click="spotClose()">Close</button>
		</div>
	</div>

	<div class="mo-card" ng-if="event">
		<div class="mo-title" ng-bind="event.view.title"></div>
		<div class="mo-row" ng-repeat="row in event.view.rows">
			<span class="mo-label" ng-bind="row.label"></span>
			<span class="mo-value" ng-bind="row.value"></span>
		</div>
		<div class="mo-note" ng-if="event.view.note" ng-bind="event.view.note"></div>
		<div class="mo-actions">
			<button class="mo-accept" ng-if="!event.view.close && !event.view.joined" ng-click="joinEvent()">Join</button>
			<button class="mo-decline" ng-if="!event.view.close && !event.view.joined" ng-click="closeEvent()">Not this time</button>
			<button class="mo-decline" ng-if="!event.view.close && event.view.joined" ng-click="leaveEvent()">Leave event</button>
			<button ng-if="event.view.close" ng-click="closeEvent()">Close</button>
		</div>
	</div>

	<div class="mo-card" ng-if="leaderboard">
		<div class="mo-title">Leaderboard</div>
		<div class="mo-tabs">
			<button ng-class="{'mo-tab-on': leaderboard.tab == 'wins'}" ng-click="showTab('wins')">Race wins</button>
			<button ng-class="{'mo-tab-on': leaderboard.tab == 'drag'}" ng-click="showTab('drag')">Drag times</button>
			<button ng-class="{'mo-tab-on': leaderboard.tab == 'spots'}" ng-click="showTab('spots')">Race spots</button>
		</div>
		<table class="mo-table" ng-if="leaderboard.tab == 'wins'">
			<tr><th>#</th><th>Player</th><th>Wins</th></tr>
			<tr ng-repeat="row in leaderboard.wins">
				<td ng-bind="row.place"></td><td ng-bind="row.name"></td><td ng-bind="row.value"></td>
			</tr>
		</table>
		<div class="mo-note" ng-if="leaderboard.tab == 'wins' && leaderboard.wins.length == 0">No race wins yet.</div>
		<div ng-if="leaderboard.tab == 'drag'" ng-repeat="strip in leaderboard.strips">
			<div class="mo-note" ng-bind="strip.name"></div>
			<table class="mo-table">
				<tr><th>#</th><th>Player</th><th>ET</th><th>Trap</th></tr>
				<tr ng-repeat="row in strip.rows">
					<td ng-bind="row.place"></td><td ng-bind="row.name"></td><td ng-bind="row.value"></td>
					<td ng-bind="row.extra"></td>
				</tr>
			</table>
		</div>
		<div class="mo-note" ng-if="leaderboard.tab == 'drag' && leaderboard.strips.length == 0">No drag times yet.</div>
		<div ng-if="leaderboard.tab == 'spots'" ng-repeat="spot in leaderboard.spots">
			<div class="mo-note" ng-bind="spot.name"></div>
			<table class="mo-table">
				<tr><th>#</th><th>Player</th><th>Time</th></tr>
				<tr ng-repeat="row in spot.rows">
					<td ng-bind="row.place"></td><td ng-bind="row.name"></td><td ng-bind="row.value"></td>
				</tr>
			</table>
		</div>
		<div class="mo-note" ng-if="leaderboard.tab == 'spots' && leaderboard.spots.length == 0">No race spot times yet; drive to one on the map.</div>
		<div class="mo-actions"><button ng-click="closeLeaderboard()">Close</button></div>
	</div>

	<div class="mo-card" ng-repeat="offer in offers track by offer.id">
		<div class="mo-title" ng-bind="offer.view.title"></div>
		<div class="mo-row" ng-repeat="row in offer.view.rows">
			<span class="mo-label" ng-bind="row.label"></span>
			<span class="mo-value" ng-bind="row.value"></span>
		</div>
		<div class="mo-bar"><div class="mo-bar-fill" ng-style="{width: barWidth(offer)}"></div></div>
		<div class="mo-note" ng-bind="offer.view.note"></div>
		<div class="mo-actions">
			<button class="mo-accept" ng-click="answer(offer, true)" ng-bind="offer.view.accept"></button>
			<button class="mo-decline" ng-click="answer(offer, false)">Decline</button>
		</div>
	</div>
</div>
